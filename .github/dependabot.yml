---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.

# see https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

# `github-actions` is deliberately absent. Every workflow in this fleet is
# rendered from infrastructure-github, so a Dependabot bump to one is
# overwritten on the next apply; action versions live in that repository's
# `local.versions` instead.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    cooldown:
      default-days: 7
      # Excluded from the cooldown above. The cooldown exists to let a
      # third-party release be withdrawn before we adopt it; a first-party
      # module has no such window — we cut the tag ourselves, and holding our
      # own fix back for a week is delay with nothing to show for it.
      exclude:
        - "github.com/gridwatch/*"
    # One pull request per ecosystem rather than one per dependency. Separate
    # pull requests from the same weekly run conflict with each other as soon
    # as the first merges, and each needs a rebase before the next can land.
    # Majors stay out of the group and open their own pull requests: the
    # grouped one merges itself where auto-merge is on, and one major would
    # hold every patch back behind a human review.
    groups:
      gomod:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "weekly"
