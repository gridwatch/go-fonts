---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.

name: Vale

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - '.gitattributes'
      - '.gitignore'
      - '.markdownlint.yml'
      - '.terraform-docs.yml'
  pull_request:
  # A run that fails at workflow load has no jobs and cannot be re-run, so
  # without this the only way to retry after such a failure is a new push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vale:
    name: vale
    # Dependabot runs get no Actions secrets, so the reusable's App-token clone
    # of the private tooling repository — where the config and vocabularies
    # live — fails with `Authentication failed` before Vale reads a file.
    #
    # Skipped rather than made to tolerate a missing token: without that clone
    # Vale has no config, so a "graceful" fallback would report a green check
    # having linted nothing. Correct on the merits too — Dependabot only edits
    # manifests and lockfiles, which carry no prose.
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: gridwatch/.github/.github/workflows/vale.yml@main
    # Passed explicitly, never left to the reusable's default: drift would change
    # what gets linted with nothing in review showing it.
    with:
      glob: '!{_vendor,.venv,layouts,node_modules,public,vendor,.specify,specs,.claude}/**'
    secrets:
      REPO_ACCESS_APP_CLIENT_ID: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
      REPO_ACCESS_APP_PRIVATE_KEY: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
