---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, Monday 04:00 UTC — off-peak, staggered from other org cron jobs.
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/copilot-instructions.md'
      - '.gitattributes'
      - '.gitignore'
      - '.markdownlint.yml'
      - '.terraform-docs.yml'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    uses: gridwatch/.github/.github/workflows/scorecard.yml@main
    # Public repo: scorecard.dev can host the score, so publish it and earn the
    # badge. The reusable defaults this to false for the private majority.
    with:
      publish_results: true
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
      checks: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
