---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.

name: golangci-lint

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/copilot-instructions.md'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - '.gitattributes'
      - '.gitignore'
      - '.markdownlint.yml'
      - '.terraform-docs.yml'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'SECURITY.md'
  pull_request:
    branches: [main]
  # A run that fails at workflow load has no jobs and cannot be re-run, so
  # without this the only way to retry after such a failure is a new push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    uses: gridwatch/.github/.github/workflows/golangci-lint.yml@632d71c1bfb7a096ce14de57a0a2ff1ae29328da  # v20260916-5
    secrets:
      REPO_ACCESS_APP_CLIENT_ID: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
      REPO_ACCESS_APP_PRIVATE_KEY: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
